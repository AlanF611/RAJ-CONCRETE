<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Ícono de la pestaña del navegador (Favicon) -->
    <!-- Tip: Sube tu logo cuadrado o un ícono a public/favicon.png -->
    <link rel="icon" type="image/png" href="/img/logo.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    
    <!-- Título y descripción para Google -->
    <title>RAJ Concrete | Structural & Site Concrete Contractor</title>
    <meta name="description" content="RAJ Concrete is a trusted concrete contractor specializing in structural and site concrete. Over 20 years of experience delivering dependable construction solutions in Southern California." />
    
    <!-- Metadatos para redes sociales (Facebook, LinkedIn, etc) -->
    <meta property="og:title" content="RAJ Concrete — Structural & Site Concrete Contractor" />
    <meta property="og:description" content="Trusted structural and site concrete solutions backed by over 20 years of hands-on experience." />
    <meta property="og:type" content="website" />
    
    <!-- Si tienes una URL oficial, agrégala aquí cuando la tengas -->
    <!-- <meta property="og:url" content="https://www.rajconcrete.com" /> -->
    
    <!-- Imagen que aparece cuando compartes el link en redes sociales -->
    <!-- Usamos tu foto del proyecto que subiste -->
    <meta property="og:image" content="/img/01_Home/photo_37.jpeg" />
    
    <!-- Metadatos para Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RAJ Concrete — Concrete Contractor" />
    <meta name="twitter:description" content="Trusted structural and site concrete solutions backed by over 20 years of experience." />
    <meta name="twitter:image" content="/img/01_Home/photo_37.jpeg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
